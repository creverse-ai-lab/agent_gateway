name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - run: npm run ci
      # Packs the npm package, installs the tarball into a temporary prefix and
      # runs the installed bins and daemon in an isolated HOME. Needs the npm
      # registry for dependencies, so it stays out of `npm run ci`.
      - run: npm run smoke:npm
